name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api test

  # ────────────────────────────────────────────────────
  # E2E tests run entirely inside Docker:
  #   1. Dockerfile.web   → builds Next.js standalone image
  #   2. Dockerfile.maestro → Java 17 + Maestro CLI + flows
  #   3. docker-compose.e2e.yml orchestrates both
  #
  # Exit code from the maestro container = pipeline result.
  # ────────────────────────────────────────────────────
  e2e-maestro:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4

      - name: Run E2E tests (Docker)
        run: |
          docker compose -f e2e/docker-compose.e2e.yml up \
            --build \
            --exit-code-from maestro \
            --abort-on-container-exit

      - name: Upload Maestro test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-e2e-results
          path: e2e/results/
          retention-days: 14

      - name: Cleanup
        if: always()
        run: docker compose -f e2e/docker-compose.e2e.yml down --volumes --remove-orphans

  # ────────────────────────────────────────────────────
  # Deploy frontend to Vercel after build + all tests pass
  # Requires GitHub secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
  # ────────────────────────────────────────────────────
  deploy-vercel:
    runs-on: ubuntu-latest
    needs: [lint-and-build, unit-tests, e2e-maestro]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN
      - name: Build with Vercel
        run: vercel build --prod --token=$VERCEL_TOKEN
      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
