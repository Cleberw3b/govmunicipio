name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ────────────────────────────────────────────────────
  # Detect which folders changed to conditionally deploy
  # ────────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'pnpm-lock.yaml'
            api:
              - 'apps/api/**'
              - 'packages/shared/**'
              - 'pnpm-lock.yaml'

  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api test

  # ────────────────────────────────────────────────────
  # E2E tests (Playwright) run inside Docker:
  #   1. Dockerfile.web        → builds Next.js standalone image
  #   2. Dockerfile.playwright → Playwright + Chromium test runner
  #   3. docker-compose.e2e.yml orchestrates both
  #
  # Exit code from the playwright container = pipeline result.
  # ────────────────────────────────────────────────────
  e2e-playwright:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4

      - name: Run E2E tests (Docker)
        run: |
          docker compose -f e2e/docker-compose.e2e.yml up \
            --build \
            --exit-code-from playwright \
            --abort-on-container-exit

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-results
          path: e2e/results/
          retention-days: 14

      - name: Cleanup
        if: always()
        run: docker compose -f e2e/docker-compose.e2e.yml down --volumes --remove-orphans

  # ────────────────────────────────────────────────────
  # Deploy frontend to Vercel — only when web/ or shared/ changed
  # Requires GitHub secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
  # ────────────────────────────────────────────────────
  deploy-vercel:
    runs-on: ubuntu-latest
    needs: [changes, lint-and-build, unit-tests, e2e-playwright]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.changes.outputs.web == 'true'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN
      - name: Build with Vercel
        run: vercel build --prod --token=$VERCEL_TOKEN
      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

  # ────────────────────────────────────────────────────
  # Deploy API to Railway — only when api/ or shared/ changed
  # Requires GitHub secrets: RAILWAY_TOKEN
  # ────────────────────────────────────────────────────
  deploy-railway:
    runs-on: ubuntu-latest
    needs: [changes, lint-and-build, unit-tests, e2e-playwright]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.changes.outputs.api == 'true'
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy to Railway
        run: railway up --service api --detach
