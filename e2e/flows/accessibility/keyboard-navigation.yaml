appId: com.govmunicipio.web
---
# Test keyboard navigation through login form
- openLink: http://localhost:3000/auth/login
- assertVisible: GovMunicípio
- assertVisible: Usuário
# Simulate Tab key to move focus through form elements
- pressKey: Tab
- wait:
    duration: 0.5
- pressKey: Tab
- wait:
    duration: 0.5
# Type in the username field (should be focused)
- inputText: testuser
- pressKey: Tab
- wait:
    duration: 0.5
# Type in the password field (should be focused)
- inputText: testpass
- pressKey: Tab
- wait:
    duration: 0.5
# Now the submit button should be focused
# Verify form is still visible (no submission yet)
- assertVisible: Entrar
