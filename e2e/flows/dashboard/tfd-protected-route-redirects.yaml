appId: com.govmunicipio.web
---
# Test that attempting to access TFD protected routes without auth redirects to login
- openLink: http://localhost:3000/tfd/requests
- wait:
    duration: 2
# Should be redirected to login page
- assertVisible: GovMunicípio
- assertVisible: Entre com suas credenciais para acessar o sistema
- assertVisible: Usuário
- assertVisible: Senha
