appId: com.govmunicipio.web
---
- openLink: http://localhost:3000/auth/login
- assertVisible: GovMunicípio
- tapOn:
    id: username
- inputText: invaliduser
- tapOn:
    id: password
- inputText: wrongpassword
- tapOn: Entrar
- waitForAnimationToEnd
- wait:
    duration: 2
# Assert error message is visible (form should show error instead of redirecting)
- assertVisible:
    text: Falha ao realizar login
    optional: true
